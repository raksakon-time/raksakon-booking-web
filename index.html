.btn-outline-danger{border-color:var(--coral)!important;color:var(--coral)!important}.btn-outline-danger:hover{background:var(--coral)!important;color:#fff!important}
.appbar .btn-outline-danger{color:#fff!important;border-color:rgba(255,255,255,.6)!important;background:transparent!important}
.appbar .btn-outline-danger:hover{background:var(--coral)!important;border-color:var(--coral)!important}
.hn-group .input-group-text{background:var(--navy)!important}
.text-danger{color:var(--coral)!important}.text-primary{color:var(--navy)!important}
/* ห้องพัก: ว่าง=ม่วงฟ้า · มีผู้ป่วย=กรมท่า · รอห้อง=ส้ม · ล็อก=เทา */
.room{background:#fff!important;border:0!important;border-left:5px solid var(--peri)!important;box-shadow:0 4px 14px rgba(42,60,118,.07)!important;border-radius:16px}
.room.bk{border-left-color:var(--navy)!important}
.room.rsv{border-left-color:#f4a340!important}
.room.lk{background:#f4f5f8!important;border-left-color:#b9bfcc!important}
.room.vip{border-right:5px solid #f4a340!important}
.room .text-success{color:var(--peri)!important}
.pt{background:var(--soft)!important;border:0!important;border-radius:12px}
.bed{background:var(--navy)!important}
.sm.ib{border:1px solid #e6e9f2!important;background:#fff!important;color:var(--navy)}
.sm.dc{color:var(--coral)!important;background:#fff1f1!important;border-color:#ffd9da!important}
.sm.cx{color:#d98a1c!important;background:#fff6e8!important;border-color:#fde3bd!important}
.sm.pr{color:var(--navy)!important;background:#eef1f8!important;border-color:#dfe4f1!important}
.lockb{color:var(--muted)}
/* แท็บชั้น: แบบเส้นใต้ (สีประจำชั้น) */
.ftabs{border-bottom:1px solid #e6e9f2;gap:4px}
.ftab{border:0!important;border-bottom:3px solid transparent!important;border-radius:0!important;background:transparent!important;color:var(--muted)!important;box-shadow:none!important}
.ftab:hover{color:var(--fc)!important}
.ftab.on{color:var(--fc)!important;border-bottom-color:var(--fc)!important}
.fcnt{background:var(--soft)!important;color:var(--fc)}.ftab.on .fcnt{background:var(--fc)!important;color:#fff}
.fpane{border-top:0!important;background:transparent!important;padding:8px 2px 2px}
.floor{color:var(--navy)}
/* ตาราง */
.tbl th,.qt th{background:var(--soft)!important;color:var(--muted)!important;font-weight:700}
.qt tbody td:first-child{border-left:3px solid var(--peri)!important}
.tbl td,.qt td{border-bottom:1px solid #eef0f5!important}
/* เมนู / ป๊อปอัป / อื่นๆ */
.rmenu-list{border:0!important;box-shadow:0 14px 36px rgba(42,60,118,.18)!important;border-radius:18px}
.rmenu-list button:hover,.rmenu-list button:focus-visible{background:var(--soft)!important;color:var(--navy)!important}
.rv-sec{background:#fff!important;border:1px solid #e8ebf3!important;border-radius:16px}.rv-h{color:var(--navy)!important}
.split-box{border:1.5px dashed var(--peri)!important}
.swal2-popup{border-radius:22px!important}
#login{background:radial-gradient(600px 360px at 85% 10%,rgba(254,105,110,.22),transparent 70%),radial-gradient(700px 420px at 10% 90%,rgba(137,160,207,.35),transparent 70%),var(--navy)!important}
#login h4{color:var(--navy)!important}
.ic{stroke-width:1.8}
.tscroll::-webkit-scrollbar-thumb,#dash::-webkit-scrollbar-thumb{background:var(--peri)!important}

#main,#rep{position:relative}
#main::before,#rep::before{content:'';position:absolute;left:0;right:0;top:0;height:240px;background:var(--navy);border-radius:0 0 40px 40px;z-index:0}
#main>*,#rep>*{position:relative;z-index:1}
.appbar{background:var(--navy)!important;box-shadow:none!important;border-radius:0!important}
.dhead{border-bottom:1px solid #e6e9f2;padding-bottom:0!important;align-items:flex-end!important}
.dtab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-family:'Prompt','Sarabun',sans-serif;font-weight:600;font-size:1rem;padding:8px 16px 9px;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px;cursor:pointer}
.dtab:hover{color:var(--navy)}.dtab.on{color:var(--navy);border-bottom-color:var(--coral)}
.dhead .btn-outline-danger{margin-bottom:6px}
#cancel{background:var(--navy)!important;color:#fff!important;border:0!important;box-shadow:0 4px 12px rgba(42,60,118,.22)}
.card-md{box-shadow:0 12px 34px rgba(42,60,118,.10)!important}
/* ฟอนต์: หัวข้อ = Prompt (ทรงเรขาคณิต) · เนื้อหา = Sarabun · ใบพิมพ์ทุกแบบ = Sarabun */
body,button,input,select,textarea,.swal2-popup{font-family:'Sarabun',sans-serif!important}
h1,h2,h3,h4,h5,h6,.swal2-title,.rv-h,.ftab,.rh b,th,#formTitle{font-family:'Prompt','Sarabun',sans-serif!important;font-weight:600!important;letter-spacing:.1px}
body{font-size:15px}
.ftab{font-size:1.2rem!important;padding:10px 8px 9px!important}.ftab .ic{width:1.1em;height:1.1em}.fcnt{font-size:.8rem!important;padding:2px 9px!important;vertical-align:.12em}
.form-label{font-weight:500!important}
#pa,#pa *{font-family:'Sarabun',sans-serif}
@media print{body{background:#fff!important}.card-md{box-shadow:none!important}}

<body>

<div id="login" class="screen" style="display:flex">
  <div class="card-md">
    <div class="text-center mb-3"><img class="logo" alt="Logo" style="width:72px;height:72px;border-radius:18px;object-fit:cover"></div>
    <h4 class="text-center fw-bold">เข้าสู่ระบบ</h4>
    <p class="text-center text-secondary">ระบบจองห้องพัก รพ.ศุภมิตร-รักษ์สกล</p>
    <label class="form-label" for="role">แผนก</label>
    <select id="role" class="form-select mb-3">
      <option value="ward">แผนกผู้ป่วยใน (Ward)</option><option value="finance">แผนกการเงิน (Finance)</option><option value="records">แผนกเวชระเบียน</option><option value="admission">แผนกจอง</option>
    </select>
    <label class="form-label" for="pin">รหัสผ่าน (PIN)</label>
    <div class="input-group mb-3"><input type="password" id="pin" class="form-control" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="****" style="border-radius:var(--r) 0 0 var(--r)"><button type="button" class="btn btn-outline-primary d-flex align-items-center" id="pinEye" onclick="togglePin()" aria-label="แสดงรหัสผ่าน" aria-pressed="false" title="แสดง/ซ่อนรหัสผ่าน" style="border-radius:0 var(--r) var(--r) 0;border-width:2px;padding:0 .9rem"></button></div>
    <button class="btn btn-primary w-100" onclick="login()"><i data-ic="login"></i> เข้าสู่ระบบ</button>
  </div>
</div>

<div id="main" class="screen container-fluid px-4 pb-4">
  <div class="appbar no-print d-flex justify-content-between align-items-center" style="margin:0 -1.5rem 1.2rem">
    <h5 class="fw-bold mb-0 d-flex align-items-center flex-wrap"><img class="logo appbar-logo" alt="โลโก้ รพ."> ระบบจองห้องพัก <small class="text-secondary fw-normal">รพ.ศุภมิตร-รักษ์สกล</small></h5>
    <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i data-ic="logout"></i> ออกจากระบบ</button>
  </div>
  <div class="row g-4">
    <div class="col-lg-4 no-print" id="formCol">
      <div class="card-md" id="formBox">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3"><h5 class="fw-bold mb-0" id="formTitle"><i data-ic="note"></i> ลงข้อมูลการจองห้องพัก</h5><div class="input-group hn-group"><span class="input-group-text">HN</span><input class="form-control" id="hn" form="f" required placeholder="ระบุ HN" autocomplete="off" style="min-width:0"><button class="btn btn-primary px-2 text-nowrap" type="button" onclick="findHN()" style="border-radius:0 var(--r) var(--r) 0;font-size:.85rem"><i data-ic="search"></i> ค้นหา/เพิ่ม</button></div></div>
        <form id="f" onsubmit="submitForm(event)">
          <div class="sec"><h6><i data-ic="user"></i> ข้อมูลผู้ป่วย</h6>
            <div class="row g-2 mb-2">
              <div class="col-8"><label class="form-label" for="name">ชื่อ - นามสกุล</label><input class="form-control" id="name" required></div>
              <div class="col-4"><label class="form-label" for="age">อายุ (ปี)</label><input type="number" class="form-control" id="age" required></div>
            </div>
            <div><label class="form-label" for="rights">สิทธิ์ผู้ป่วย</label><input class="form-control" id="rights" list="rightsList" placeholder="เช่น บัตรทอง / ประกันสังคม" autocomplete="off"><datalist id="rightsList"><option value="ชำระเงินเอง"><option value="บัตรทอง (UC)"><option value="ประกันสังคม"><option value="ข้าราชการ"><option value="ประกันสุขภาพ"><option value="ต่างด้าว"></datalist></div></div>
          <div class="sec"><h6><i data-ic="building"></i> ข้อมูลการเข้าพัก</h6>
            <label class="form-label" for="date">วันที่เข้าพัก</label><input type="date" class="form-control mb-3" id="date" required onchange="roomOpts()">
            <div class="row g-2 mb-3" id="roomRow"><div class="col-6"><label class="form-label" for="room">ห้อง</label><select class="form-select" id="room" required onchange="bedOpts()"></select></div>
            <div class="col-6"><label class="form-label" for="bed">เตียง</label><select class="form-select" id="bed"></select></div></div>
            <div class="row g-2"><div class="col-6"><label class="form-label" for="doc">แพทย์เจ้าของไข้</label><select class="form-select" id="doc" required></select></div>
            <div class="col-6"><label class="form-label" for="agent">ผู้รับจอง</label><select class="form-select" id="agent" required></select></div></div></div>
          <div class="sec" id="paySec" style="border:2px solid var(--p)"><h6><i data-ic="card"></i> ข้อมูลการชำระเงิน</h6>
            <label class="form-label" for="pay">รูปแบบการชำระเงิน</label><select class="form-select mb-3" id="pay" onchange="payChange()"></select>
            <div id="bill"></div><hr>
            <div class="d-flex justify-content-between align-items-center"><div class="fw-bold">ยอดรวมสุทธิ:<br><small class="fw-normal text-secondary" id="totTxt">ศูนย์บาทถ้วน</small></div><div class="fs-3 fw-bold text-danger" id="tot">0.00</div></div>
            <div id="splitBox" class="d-none mt-3 p-3 rounded-4 split-box">
              <div class="fw-bold mb-2" style="color:#0842a0"><i data-ic="card"></i> ระบุยอดชำระ (โอน + เงินสด)</div>
              <div class="row g-2">
                <div class="col-6"><label class="form-label" for="pT"><i data-ic="bank"></i> ยอดโอน</label><div class="input-group split-in t"><span class="input-group-text">฿</span><input type="number" inputmode="decimal" min="0" step="0.01" class="form-control" id="pT" placeholder="0.00" oninput="splitEdit('T')"></div></div>
                <div class="col-6"><label class="form-label" for="pC"><i data-ic="cash"></i> ยอดเงินสด</label><div class="input-group split-in c"><span class="input-group-text">฿</span><input type="number" inputmode="decimal" min="0" step="0.01" class="form-control" id="pC" placeholder="0.00" oninput="splitEdit('C')"></div></div>
              </div>
              <div class="small mt-2 fw-bold" id="splitInfo"></div></div></div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1" id="save"><i data-ic="save"></i> บันทึกการจอง</button>
            <button type="button" class="btn btn-outline-secondary d-none" id="cancel" onclick="resetForm()"><i data-ic="x"></i> ยกเลิก</button>
          </div>
        </form>
      </div>
    </div>
    <div class="col-lg-8" id="dashCol">
      <div class="card-md">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2 no-print">
          <h5 class="fw-bold mb-0"><i data-ic="board"></i> ระบบจัดการหน้าเคาน์เตอร์</h5>
          <div class="rmenu" id="rmenu">
            <button type="button" class="btn btn-sm btn-primary" id="rmenuBtn" aria-haspopup="true" aria-expanded="false" onclick="toggleRMenu()"><i data-ic="table"></i> รายงาน <i data-ic="chev"></i></button>
            <div class="rmenu-list" id="rmenuList" role="menu" hidden>
              <button type="button" role="menuitem" onclick="rmGo('report')"><i data-ic="table"></i> รายงานตาราง</button>
              <button type="button" role="menuitem" onclick="rmGo('queue')"><i data-ic="list"></i> รายงานคิว</button>
              <button type="button" role="menuitem" id="btnFin" onclick="rmGo('finance')"><i data-ic="money"></i> ยอดเงิน</button>
              <button type="button" role="menuitem" onclick="rmGo('dc')"><i data-ic="dc"></i> รายงาน D/C</button>
              <button type="button" role="menuitem" onclick="rmGo('cancel')"><i data-ic="cancel"></i> ยกเลิกผ่าตัด</button>
              <button type="button" role="menuitem" onclick="rmGo('label')"><i data-ic="sign"></i> ป้ายหน้าห้อง</button>
            </div>
          </div>
        </div>
        <div class="text-center my-4" id="spin" style="display:none"><div class="spinner-border text-primary"></div></div>
        <div id="dash"></div>
      </div>
    </div>
  </div>
</div>

<div id="rep" class="screen container-fluid p-4">
  <div class="card-md">
    <div class="ph"><div><h3 class="fw-bold mb-1" id="rTitle"></h3><p class="mb-0">รพ.ศุภมิตร-รักษ์สกล | วันที่: <b id="rDateTxt"></b></p></div><img class="logo" alt="Logo" style="width:18mm;height:18mm;border-radius:8px;object-fit:cover"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 no-print">
      <button class="btn btn-sm btn-outline-dark" onclick="show('main')"><i data-ic="back"></i> หน้าหลัก</button>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <div id="rBatch" class="d-flex flex-wrap gap-2"></div>
        <input type="date" class="form-control w-auto" id="rDate" onchange="renderReport()" aria-label="วันที่รายงาน">
        <button class="btn btn-sm btn-outline-primary" id="rAll" onclick="$('rDate').value='';renderReport()"><i data-ic="list"></i> ดูทั้งหมด</button>
        <select class="form-select form-select-sm w-auto" id="paper" onchange="paper=this.value;setPage(paper)" aria-label="ขนาดกระดาษ"></select>
        <button class="btn btn-sm btn-primary" onclick="window.print()"><i data-ic="print"></i> พิมพ์</button>
      </div>
    </div>
    <div class="table-responsive tscroll"><table class="table table-hover align-middle tbl"><thead id="rHead"></thead><tbody id="rBody"></tbody><tfoot id="rFoot"></tfoot></table></div>
  </div>
</div>
<div id="pa"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

 d="M10 17l5-5-5-5M15 12H3"/>', save: '<path d="M5 12l5 5L20 7"/>', check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', bed: '<path d="M3 18V7M21 18v-5a3 3 0 0 0-3-3h-8v6M3 15h18"/><circle cx="6.5" cy="11.5" r="1.5"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', unlock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>', eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>', upload: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 21h14"/>', trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>', phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>', x: '<path d="M18 6L6 18M6 6l12 12"/>'};

const FC = ['#2A3C76', '#5d78c0', '#FE696E', '#f4a340'];   // สีประจำแท็บ: ชั้น 2B · ชั้น 2 · ชั้น 3 · รอห้องสำรอง

const API_URL = 'https://script.google.com/macros/s/AKfycbye-Htxn_FNsWcEFWTbza40iKSZMGBYbWWRPFIZEM6LkpmGBSNeZSnnHnCqtrlMaanRnw/exec';   // ← ใส่ URL ของ Web app ที่ deploy แล้ว
let TOKEN = sessionStorage.getItem('rk_token') || '';
async function api(action, body = {}) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  let res;
  try {
    const r = await fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action, token: TOKEN, ...body}), signal: ctl.signal, redirect: 'follow'});
    res = await r.json();
  } catch (e) { const err = new Error(e.name === 'AbortError' ? 'หมดเวลาเชื่อมต่อ กรุณาลองใหม่' : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต'); err.code = 'NET'; throw err; }
  finally { clearTimeout(t); }
  if (!res || !res.ok) { const err = new Error((res && res.error) || 'เกิดข้อผิดพลาด'); err.code = res && res.code; if (err.code === 'AUTH' && action !== 'login') sessionExpired(); throw err; }
  return res.data;
}
const gas = (name, ...args) => api(name, {args});
function sessionExpired() {
  const was = !!role; TOKEN = ''; sessionStorage.removeItem('rk_token'); sessionStorage.removeItem('rk_role');
  if (was) { logout(true); msg('warning', 'หมดเวลาการใช้งาน', 'กรุณาเข้าสู่ระบบใหม่'); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const gasRead = async (n, ...a) => { try { return await gas(n, ...a); } catch (e) { if (e.code === 'AUTH') throw e; await sleep(800); return gas(n, ...a); } };
const msg = (icon, title, text) => Swal.fire({icon, title, text, confirmButtonText:'ตกลง', confirmButtonColor:'#2A3C76', customClass:{popup:'rounded-4'}});
const toast = t => Swal.fire({icon:'success', title:'สำเร็จ', text:t, timer:1500, showConfirmButton:false, customClass:{popup:'rounded-4'}});
const ask = (title, text, ok) => Swal.fire({title, text, icon:'warning', showCancelButton:true, confirmButtonColor:'#FE696E', cancelButtonColor:'#8a93ad', confirmButtonText:ok, cancelButtonText:'ยกเลิก', customClass:{popup:'rounded-4'}}).then(r => r.isConfirmed);
async function seq(items, fn) { let ok = 0; for (const i of items) { try { await fn(i); ok++; } catch (e) { console.error(e); } } return ok; }

function apply(d, force) {
  const b = d.bookings || [], l = d.lockedRooms || [];
  if (!force && JSON.stringify([b, l]) === JSON.stringify([DATA, LOCKED])) return;
  DATA = b; LOCKED = l; draw(); roomOpts();
}

  $('spin').style.display = 'block';

  finally { $('spin').style.display = 'none'; }
}
let timer;

  if (!document.hidden && role && !busy && editing === null && !$('save').disabled) { try { apply(await gas('getInitialData')); } catch (e) { console.warn(e); } }

}

// ---------- ห้อง / เตียง ----------
function used(room, date) { return active().filter(b => b.room === room && b.date === date && b.id !== editing); }
function roomOpts() {
  if (role === 'records') { $('room').innerHTML = `<option value="${WAIT}" selected>${WAIT}</option>`; bedOpts(); return; }   // เวชระเบียน = คิวรอจัดห้องอัตโนมัติ
  const date = $('date').value, keep = $('room').value;
  let h = `<option value="" disabled ${keep ? '' : 'selected'}>เลือกห้อง...</option><option value="${WAIT}" ${keep === WAIT ? 'selected' : ''}>${WAIT}</option><option value="${RSV}" ${keep === RSV ? 'selected' : ''}>${RSV}</option>`;
  for (const [fl, rooms] of FLOORS) {
    const o = rooms.filter(r => {
      if (LOCKED.includes(r)) return false;
      if (editing && keep === r) return true;
      const u = used(r, date).map(b => b.bed);
      return !(u.includes(SOLO) || u.filter(x => (x || '').startsWith('เตียง')).length >= maxBeds(r));
    }).map(r => `<option ${keep === r ? 'selected' : ''}>${r}</option>`).join('');
    if (o) h += `<optgroup label="${fl}">${o}</optgroup>`;
  }
  $('room').innerHTML = h; bedOpts();
}
function bedOpts() {
  const room = $('room').value, keep = $('bed').value;
  if (!room || room === WAIT || room === RSV) { $('bed').innerHTML = `<option>${SOLO}</option><option>-</option>`; if (room === WAIT || room === RSV) $('bed').value = '-'; return; }
  const u = used(room, $('date').value).map(b => b.bed);
  let beds = [SOLO, ...Array.from({length:maxBeds(room)}, (_, i) => `เตียง ${i+1}`), '-'].filter(b => !u.includes(b));
  if (u.length) beds = beds.filter(b => b !== SOLO);
  $('bed').innerHTML = beds.map(b => `<option>${b}</option>`).join('');
  if (beds.includes(keep)) $('bed').value = keep;
}

// ---------- ยอดเงิน ----------
function THB(n) {
  const d = ['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], u = ['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  const rd = s => [...s].map((c, i) => { const v = +c, p = s.length - i - 1; return !v ? '' : p === 1 && v === 1 ? 'สิบ' : p === 1 && v === 2 ? 'ยี่สิบ' : p === 0 && v === 1 && s.length > 1 && s[i-1] !== '0' ? 'เอ็ด' : d[v] + u[p]; }).join('');
  if (!n) return 'ศูนย์บาทถ้วน';
  const [b, s] = n.toFixed(2).split('.'); return rd(b) + 'บาท' + (s === '00' ? 'ถ้วน' : rd(s) + 'สตางค์');
}
function typeChange() { $('roomRow').style.display = role === 'records' ? 'none' : ''; roomOpts(); }
function assignRoom(id) { editBooking(id); $('room').value = ''; bedOpts(); $('room').focus(); }
function payChange() {
  const on = $('pay').value === SPLIT; $('splitBox').classList.toggle('d-none', !on);
  if (on && anyItem() && !$('pT').value && !$('pC').value) { $('pT').value = total(); $('pC').value = 0; } calc();
}
function splitEdit(src) {
  if (anyItem()) { const t = total(), v = x => +x.value || 0; if (src === 'T') $('pC').value = Math.max(0, +(t - v($('pT'))).toFixed(2)); else $('pT').value = Math.max(0, +(t - v($('pC'))).toFixed(2)); }
  calc();
}
function splitInfo() {
  const sum = (+$('pT').value || 0) + (+$('pC').value || 0), t = total();
  $('splitInfo').innerHTML = !anyItem() ? `<span class="text-primary">ยอดรวม = โอน + สด = ${money(sum)}</span>`
    : Math.abs(sum - t) < 0.01 ? `<span class="text-success">${ic('check')} โอน + สด = ${money(sum)}</span>` : `<span class="text-danger">โอน + สด = ${money(sum)} (ต้องเท่ากับยอดรวม ${money(t)})</span>`;
}
function billToggle(i) {
  const c = $('c' + i), a = $('a' + i); a.disabled = !c.checked;
  if (c.checked) { if (ITEMS[i][2] && !a.value) a.value = ITEMS[i][2]; a.focus(); } else a.value = '';
  calc();
}
const anyItem = () => ITEMS.some((_, i) => $('c' + i).checked);
function total() {
  if (anyItem()) return ITEMS.reduce((s, _, i) => s + ($('c' + i).checked ? +$('a' + i).value || 0 : 0), 0);
  if ($('pay').value === SPLIT) return (+$('pT').value || 0) + (+$('pC').value || 0);   // ไม่ติ๊กรายการ: ยอดรวม = โอน + สด
  return editing ? baseAmt : 0;
}
function calc() {
  if ($('pay').value === SPLIT && anyItem()) $('pC').value = Math.max(0, +(total() - (+$('pT').value || 0)).toFixed(2));   // ติ๊กรายการ: เงินสด = ยอดคงเหลือหลังโอน
  const t = total(); $('tot').textContent = money(t); $('totTxt').textContent = THB(t); splitInfo();
}

      + (items.length ? items.map(([n, v]) => row(esc(n), `${money(v)} บาท`)).join('') : row('รายการเรียกเก็บ', '-'))

  const qrAmt = pay === 'โอน' ? t : tr, qr = (pay === 'โอน' || (sp && tr > 0)) ? (() => { const dyn = !!payQrPayload(qrAmt); return `<div style="margin-top:8px;display:flex;align-items:center;gap:14px;break-inside:avoid;page-break-inside:avoid">${tqrCard(qrAmt, '40mm', '28mm', '7pt')}<div style="font-size:.9rem;line-height:1.5;color:#000"><div style="font-weight:700">${ic('phone')} สแกนจ่ายผ่านแอปธนาคาร</div><div>${dyn ? 'ยอดเงินขึ้นอัตโนมัติ ไม่ต้องกรอก' : 'กรุณากรอกยอดตามที่ระบุ'}</div><div style="margin-top:6px;padding:4px 10px;border:1.5px solid #0b57d0;border-radius:8px;display:inline-block;font-weight:700;font-size:1.05rem">ยอดชำระ ${money(qrAmt)} บาท</div></div></div>`; })() : '';
  printArea(`<div style="font-family:Sarabun,sans-serif;width:100%;max-width:13.5cm;margin:0 auto;line-height:1.35;font-size:.95rem"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="flex:1;text-align:center"><h3 style="font-size:1.2rem;font-weight:700;margin:0">ใบรายการจองห้องพักและเรียกเก็บค่าใช้จ่ายส่วนเกิน</h3><h4 style="font-size:1rem;margin:4px 0 0">ผ่าตัดตา รพ.ศุภมิตร-รักษ์สกล</h4></div>${logoQr(F.hn)}</div>
    <div style="display:flex;gap:8px;margin-bottom:8px"><b>ชื่อผู้ป่วย</b><span style="flex:1;${dot}">${esc(F.name)}</span><b>HN</b><span style="width:100px;${dot}">${esc(F.hn) || '-'}</span></div>
    <div style="display:flex;align-items:flex-end;gap:6px;margin-bottom:8px;font-size:.85rem"><b>วันที่</b><span style="width:64px;${dot}">${dt}</span><b>ห้องพัก</b><span style="flex:1.2;min-width:0;overflow-wrap:anywhere;${dot}">${esc(dispRoom)}</span><b>สิทธิ์</b><span style="flex:1;min-width:0;overflow-wrap:anywhere;${dot}">${esc(rights) || '-'}</span><b>วิธีชำระเงินส่วนเกิน</b><span style="flex:1;min-width:0;overflow-wrap:anywhere;${dot}">${esc(pay)}</span></div>
    <div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:12px"><b>แพทย์เจ้าของไข้</b><span style="flex:1;min-width:0;overflow-wrap:anywhere;${dot}">${esc(F.doc) || '-'}</span></div>
    <table style="width:100%;border-collapse:collapse;text-align:center;font-size:.85rem;margin-bottom:12px"><thead><tr style="background:#f8f9fa"><th style="${cell};width:12%">ลำดับ</th><th style="${cell}">รายการ</th><th style="${cell}">ราคา</th><th style="${cell}">ส่วนเกิน (บาท)</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="display:flex;gap:8px;font-weight:700;margin-bottom:22px"><span>รวม</span><span style="flex:1;${dot}">( ${THB(t)} )</span><span style="width:100px;${dot};text-align:right">${money(t)}</span><span>บาท</span></div>
    ${sp ? `<div style="font-size:.9rem;font-weight:600;margin:-8px 0 14px">ชำระโดย: โอน ${money(tr)} บาท + เงินสด ${money(cs)} บาท</div>` : ''}<div style="display:flex;justify-content:space-between;font-size:.9rem"><div style="width:48%"><div style="display:flex;gap:6px;margin-bottom:20px"><b>ผู้ชำระเงิน</b><span style="flex:1;border-bottom:1px dotted #000"></span><span>ผู้ป่วย/ญาติ</span></div><div style="border-bottom:1px dotted #000;margin:0 10%;height:1em"></div></div>
    <div style="width:48%"><div style="display:flex;gap:6px;margin-bottom:8px"><b>ผู้รับเงิน</b><span style="flex:1;border-bottom:1px dotted #000"></span></div><div style="text-align:center;margin-bottom:8px">( <span style="display:inline-block;min-width:130px">${esc(agent)}</span> )</div><div style="display:flex;gap:6px;margin-bottom:8px"><b>วันที่</b><span style="flex:1;${dot}">${dt}</span></div><div style="text-align:center">(เจ้าหน้าที่การเงิน)</div></div></div>${qr}
    <div style="margin-top:12px;text-align:center;font-size:.8rem;color:#444;border-top:1px dashed #ccc;padding-top:8px">* เอกสารนี้เป็นเพียงใบแสดงหลักฐานการชำระเงิน ส่วนใบเสร็จรับเงินทางโรงพยาบาลจะออกให้ในวันที่ผู้ป่วยออกจากโรงพยาบาล หากท่านยังไม่ได้รับโปรดแจ้งเจ้าหน้าที่</div></div>`, 'A5 portrait');
}
</script>
</body>
</html>
